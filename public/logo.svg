<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <linearGradient id="logoStarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="120" fill="url(#logoBgGrad)" />

  <!-- Inner Stroke Highlight -->
  <rect x="4" y="4" width="504" height="504" rx="116" fill="none" stroke="#ffffff" stroke-width="6" opacity="0.15" />

  <!-- Dish Base / Platter -->
  <rect x="120" y="348" width="272" height="28" rx="14" fill="#ffffff" />
  <rect x="160" y="376" width="192" height="12" rx="6" fill="#ffffff" opacity="0.65" />

  <!-- Cloche Dome -->
  <path d="M 144 332 C 144 236 196 194 256 194 C 316 194 368 236 368 332 Z" fill="#ffffff" />

  <!-- Cloche Top Knob -->
  <circle cx="256" cy="172" r="22" fill="#ffffff" />
  <rect x="250" y="184" width="12" height="14" rx="4" fill="#ffffff" />

  <!-- Stylized Geometric 'M' Cutout Motif inside Dome -->
  <path d="M 212 300 L 236 248 C 242 236 248 236 256 246 C 264 236 270 236 276 248 L 300 300" 
        fill="none" stroke="#16a34a" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" />

  <!-- 4-Point Rating Star Sparkle (Top Right) -->
  <path d="M 366 160 Q 366 186 392 186 Q 366 186 366 212 Q 366 186 340 186 Q 366 186 366 160 Z" 
        fill="url(#logoStarGrad)" />
  <circle cx="366" cy="186" r="4" fill="#ffffff" />
</svg>
